<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Demo Overlay - iframes and shadow DOM test</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 24px; max-width: 760px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; margin: 12px 0; }
  iframe { width: 100%; height: 90px; border: 1px solid #ccc; border-radius: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; color: #666; margin: 0 0 6px; }
</style>
</head>
<body>
  <h1 id="page-title">Frames and shadow DOM</h1>
  <p>A test app that hides its numbers inside iframes and web components, like many real enterprise apps.</p>

  <div class="card"><h2>Same host iframe (localhost)</h2><iframe id="f1" src="/frame-inner.html"></iframe></div>
  <div class="card"><h2>Other host iframe (127.0.0.1)</h2><iframe id="f2" src="http://127.0.0.1:8000/frame-inner.html"></iframe></div>
  <div class="card"><h2>srcdoc iframe</h2><iframe id="f3" srcdoc="<div>Quota: <span id='srcdoc-value'>REAL SRCDOC 7</span></div>"></iframe></div>

  <div class="card"><h2>Open shadow root</h2><stat-card id="open-card"></stat-card></div>
  <div class="card"><h2>Closed shadow root</h2><secret-card id="closed-card"></secret-card></div>
  <div class="card"><h2>Nested: shadow inside shadow</h2><outer-card></outer-card></div>

<script>
  class StatCard extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<div>Revenue: <span class="total">REAL SHADOW 500</span></div>'; }
  }
  class SecretCard extends HTMLElement {
    constructor() { super(); const r = this.attachShadow({ mode: 'closed' }); r.innerHTML = '<div>Churn: <span class="total">REAL CLOSED 9</span></div>'; }
  }
  class OuterCard extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<div>Inner: <inner-card></inner-card></div>'; }
  }
  class InnerCard extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<b class="deep">REAL NESTED 1</b>'; }
  }
  customElements.define('stat-card', StatCard);
  customElements.define('secret-card', SecretCard);
  customElements.define('inner-card', InnerCard);
  customElements.define('outer-card', OuterCard);

  // an app that re-renders its web component after a moment
  setTimeout(() => {
    document.getElementById('open-card').shadowRoot.innerHTML = '<div>Revenue: <span class="total">REAL SHADOW 500</span> (re-rendered)</div>';
  }, 700);
</script>
</body>
</html>
